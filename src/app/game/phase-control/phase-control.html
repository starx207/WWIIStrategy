<div class="phase-control">
  <div class="turn-info">
    <span class="nation">{{ nationLabel() }}</span>
    @if (playerName()) {
      <span class="player">{{ playerName() }}</span>
    }
    <span class="phase">{{ phaseLabel() }}</span>
  </div>
  @if (showAdvance()) {
    <button
      type="button"
      class="next"
      [disabled]="!canAdvance()"
      [title]="blockers().join(', ')"
      (click)="nextPhase()"
    >
      {{ advanceLabel() }}
    </button>
  }
</div>
