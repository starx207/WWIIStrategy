<ww2-app-header></ww2-app-header>
<ww2-game-map></ww2-game-map>

@if (turnPhase() === TurnPhase.PURCHASE_UNITS) {
  <ww2-purchase-panel></ww2-purchase-panel>
}

@if (turnPhase() === TurnPhase.WEAPONS_DEVELOPMENT) {
  <ww2-tech-panel></ww2-tech-panel>
}

@if (turnPhase() === TurnPhase.PLACE_NEW_UNITS) {
  <ww2-placement-panel></ww2-placement-panel>
}

<div class="game-controls">
  <button type="button" (click)="openSaveDialog()">Save Game</button>
  <button type="button" (click)="exitToMenu()">Main Menu</button>
</div>

@if (saveDialogOpen()) {
  <div class="dialog-backdrop" (click)="cancelSave()">
    <div class="dialog" (click)="$event.stopPropagation()">
      <h2>Save Game</h2>
      <label for="save-file-name">File name</label>
      <input
        id="save-file-name"
        type="text"
        [value]="saveFileName()"
        (input)="updateSaveFileName($any($event.target).value)"
        (keydown.enter)="confirmSave()"
      />
      <div class="dialog-actions">
        <button type="button" (click)="cancelSave()">Cancel</button>
        <button type="button" class="primary" (click)="confirmSave()">Download</button>
      </div>
    </div>
  </div>
}
